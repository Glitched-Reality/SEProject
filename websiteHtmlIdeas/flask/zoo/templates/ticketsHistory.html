{%extends "base.html"%}
{%block content%}
    <table class="striped">
        <thead>
            <tr>
                <th>Name:</th>
                <th>Date:</th>
                <th>Number of Tickets:</th>
                <th>Contact Information:</th>
                <th>&nbsp;</th>
            </tr>
        </thead>
        <tbody>
            {%for ticket in tickets%}
                <tr>
                    <td>{{ticket.name}}</td>
                    <td>{{ticket.visitDate}}</td>
                    <td>{{ticket.numTickets}}</td>
                    <td>{{ticket.contact}}</td>
                    <td>
                        <a role="button" href="/tickets/edit/{{ticket.orderNumber}}"><i class="bi bi-pencil-square"></i></a>
                        <a role="button" href="/tickets/delete/{{ticket.orderNumber}}"><i class="bi bi-trash3"></i></a>
                    </td>
                </tr>
            {%endfor%}
        </tbody>

    </table>

{%endblock%}
