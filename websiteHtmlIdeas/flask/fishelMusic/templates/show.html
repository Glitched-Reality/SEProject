{%extends "base.html"%}
{%block content%}
    <div>
        <h1 class="title">{{playlistName}}</h1>
        <table>
            <thead>
                <tr>
                    <th scope="col">Title</th>
                    <th scope="col">Artist</th>
                    <th scope="col">Genre</th>
                    <th scope="col">Rating</th>
                </tr>
            </thead>
            <tbody>
                {%for song in playlist%}
                    <tr>
                        <th scope="row">{{song.title}}</th>
                        <td>{{song.artist}}</td>
                        <td>{{song.genre}}</td>
                        <td>
                            {%for star in range(5)%}
                                {%if song.rating > loop.index0 %}
                                    <i class="bi bi-star-fill"></i>
                                {%else%}
                                    <i class="bi bi-star"></i>
                                {%endif%}
                            {%endfor%}
                        </td>
                    </tr>
                {%endfor%}
            </tbody>
        </table>
    </div>
{%endblock%}
